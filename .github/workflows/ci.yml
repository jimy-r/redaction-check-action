name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r .github/requirements-ci.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest test_redaction_check -v

  self-test:
    name: Dogfood the action against a fixture diff
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The action installs 3.12 for itself. A caller's own Python, here 3.13,
      # must still be the one its later steps get.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Record the caller's Python
        id: caller-python
        shell: bash
        run: |
          set -euo pipefail
          echo "python=$(python -c 'import sys; print(sys.version.split()[0], sys.executable)')" >> "$GITHUB_OUTPUT"
          echo "location=${pythonLocation:-}" >> "$GITHUB_OUTPUT"

      # On a pull_request the checkout is GitHub's test merge, and only there
      # does the action diff against the merge's first parent. The fixture
      # steps below scan a commit on top of it, which takes the merge-base
      # path, so this is the one run of the path pull requests use.
      - name: Run the action on the untouched checkout (expect a pass)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          # This repository's own opt-in: the scanner and its tests carry
          # secret-shaped fixtures on purpose.
          skip-scanner-files: 'true'

      - name: Add a fixture commit on top of the checkout with a detectable shape
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "ci@example.invalid"
          git config user.name "redaction-check self-test"
          # Build on the checked-out commit, not origin/main. On a pull_request
          # event the action refuses a checkout that does not contain the pull
          # request's head, so a fixture on origin/main would exit 2.
          git checkout -b self-test-fixture
          mkdir -p .fixture
          {
            echo "This line is clean."
            printf 'path was /home/%s/config\n' "prodserver7"
          } > .fixture/probe.txt
          git add .fixture/probe.txt
          git commit -q -m "self-test fixture: inject a detectable shape"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run the action against the dirty fixture (expect it to flag)
        id: dirty
        uses: ./
        continue-on-error: true
        with:
          base-ref: main
          skip-scanner-files: 'true'

      # Exactly 1, and naming the fixture. A scan that cannot run exits 2,
      # which fails the step just the same.
      - name: Assert the dirty fixture was caught
        shell: bash
        env:
          EXIT_CODE: ${{ steps.dirty.outputs.exit-code }}
          REPORT: ${{ steps.dirty.outputs.report }}
        run: |
          set -euo pipefail
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::Self-test failed: the action exited '$EXIT_CODE' on the dirty fixture, not 1."
            exit 1
          fi
          if ! grep -qF 'file=.fixture/probe.txt,' "$REPORT"; then
            echo "::error::Self-test failed: no finding names .fixture/probe.txt."
            exit 1
          fi
          echo "Self-test OK (positive case): the action flagged the injected fixture."

      - name: Remove the shape again in a second commit
        shell: bash
        run: |
          set -euo pipefail
          printf 'This line is clean.\nSo is this one.\n' > .fixture/probe.txt
          git add .fixture/probe.txt
          git commit -q -m "self-test fixture: remove the shape"

      - name: Run the action with the shape only in history (expect it to flag)
        id: history
        uses: ./
        continue-on-error: true
        with:
          base-ref: main
          skip-scanner-files: 'true'

      - name: Assert the finding names the commit that added the shape
        shell: bash
        env:
          EXIT_CODE: ${{ steps.history.outputs.exit-code }}
          REPORT: ${{ steps.history.outputs.report }}
          DIRTY_SHA: ${{ steps.fixture.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$EXIT_CODE" != "1" ]; then
            echo "::error::Self-test failed: the action exited '$EXIT_CODE' with the shape in history, not 1."
            exit 1
          fi
          if ! grep -F 'file=.fixture/probe.txt,' "$REPORT" | grep -qF "added in commit ${DIRTY_SHA:0:12}"; then
            echo "::error::Self-test failed: no finding names .fixture/probe.txt at commit ${DIRTY_SHA:0:12}."
            exit 1
          fi
          echo "Self-test OK (history case): the finding names the commit that added the shape."

      - name: Replace both fixture commits with clean content only
        shell: bash
        run: |
          set -euo pipefail
          # Drop both commits. Every commit in the range is scanned, so the
          # dirty one fails the scan for as long as it is there.
          git reset -q --hard HEAD~2
          mkdir -p .fixture
          printf 'This line is clean.\nSo is this one.\n' > .fixture/probe.txt
          git add .fixture/probe.txt
          git commit -q -m "self-test fixture: clean content only"

      - name: Run the action against the clean fixture (expect a pass)
        id: clean
        uses: ./
        continue-on-error: true
        with:
          base-ref: main
          skip-scanner-files: 'true'

      - name: Assert the clean fixture passed
        shell: bash
        env:
          EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
        run: |
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Self-test failed: the action exited '$EXIT_CODE' on content with nothing to catch, not 0."
            exit 1
          fi
          echo "Self-test OK (negative case): clean content passed."

      - name: Assert the action left the caller's Python alone
        shell: bash
        env:
          BEFORE: ${{ steps.caller-python.outputs.python }}
          BEFORE_LOCATION: ${{ steps.caller-python.outputs.location }}
        run: |
          set -euo pipefail
          after=$(python -c 'import sys; print(sys.version.split()[0], sys.executable)')
          if [ "$after" != "$BEFORE" ] || [ "${pythonLocation:-}" != "$BEFORE_LOCATION" ]; then
            echo "::error::Self-test failed: the caller's Python was '$BEFORE' before the action ran and '$after' after it."
            exit 1
          fi
          echo "Self-test OK: the caller's Python is still $after."
