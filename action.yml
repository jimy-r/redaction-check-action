name: Redaction check
description: >-
  Scan a pull request's added lines for the shapes of private content --
  emails, absolute home paths, credential prefixes, private-IP/hostname
  shapes, and common secret-file names -- before it merges.
author: James Ross

branding:
  icon: shield
  color: gray-dark

inputs:
  patterns-file:
    description: >-
      Path (relative to the checkout) to an optional extra denylist file,
      one regular expression per line. Blank lines and lines starting with
      # are skipped.
    required: false
    default: ''
  allow-file:
    description: >-
      Path (relative to the checkout) to an optional allow file, one exact
      value per line, whose matches are counted instead of reported. Blank
      lines and # comments are skipped. In added-lines mode it is read from
      a commit the change can't edit, so an entry a pull request or push adds
      lets nothing through until it has landed. When the checkout is GitHub's
      test merge, the pull_request default, that is the commit the merge was
      built on. Otherwise it is the base as it is now, the base branch's tip
      or the commit a SHA base-ref names, except on a push to a branch other
      than the default one, which reads the default branch's tip. It is never
      the merge base. If that commit isn't in the clone, no allow file is
      read and a notice says so. In all-files mode it is read as HEAD commits
      it, and that copy is always scanned. It never applies to the allow file
      itself. Set it to '' to turn it off.
    required: false
    default: .redaction-allow
  fail-on:
    description: >-
      'match' (default) fails the step when any finding is reported. 'none'
      reports findings as warning annotations without failing the step --
      use this while first rolling the gate out on an existing repo. A diff
      that cannot be computed fails the step under either setting.
    required: false
    default: match
  scan-mode:
    description: >-
      'added-lines' (default) scans only lines added since base-ref, the
      normal PR gate. 'all-files' walks every git-tracked file in the
      checkout instead, for a full-repo audit run.
    required: false
    default: added-lines
  base-ref:
    description: >-
      Branch to diff against in added-lines mode, or a full commit SHA.
      Defaults to the pull request's base branch (github.base_ref). Set
      this explicitly when triggering on an event other than pull_request.
      On a push to the default branch, pass github.event.before: a push to
      main with base-ref main diffs main against itself and scans nothing. On
      a push to any other branch, pass the default branch
      (github.event.repository.default_branch), which scans everything the
      branch adds, the push that creates it included. On a pull_request
      event against that same base, the scan diffs GitHub's test-merge
      commit against its own first parent instead, so a base branch that
      moves while the check is queued cannot break it.
    required: false
    default: ''
  skip-scanner-files:
    description: >-
      'true' skips redaction_check.py and test_redaction_check.py at the
      repository root, whose test fixtures are secret-shaped on purpose.
      Only this action's own repository should set it. Anywhere else,
      files with those names are scanned like any other. Default 'false'.
    required: false
    default: 'false'

outputs:
  exit-code:
    description: >-
      The scan's exit code. 0 means clean, or findings under fail-on none.
      1 means findings. 2 means the scan could not run, such as a base-ref
      it cannot use or a diff it cannot compute.
    value: ${{ steps.scan.outputs.exit-code }}
  report:
    description: >-
      Path to a file on the runner that holds the scanner's output, the
      same masked findings the log shows.
    value: ${{ steps.scan.outputs.report }}

runs:
  using: composite
  steps:
    # update-environment false: the default puts this Python first on the
    # job's PATH, and every later step in the caller's job ran on 3.12.
    - name: Set up Python
      id: py
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'
        update-environment: false

    - name: Scan for private-content shapes
      id: scan
      shell: bash
      env:
        PYTHON: ${{ steps.py.outputs.python-path }}
        PATTERNS_FILE: ${{ inputs.patterns-file }}
        ALLOW_FILE: ${{ inputs.allow-file }}
        FAIL_ON: ${{ inputs.fail-on }}
        SCAN_MODE: ${{ inputs.scan-mode }}
        BASE_REF: ${{ inputs.base-ref || github.base_ref }}
        PR_BASE_REF: ${{ github.base_ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_NAME: ${{ github.event_name }}
        GIT_REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SKIP_SCANNER_FILES: ${{ inputs.skip-scanner-files }}
      run: |
        set -euo pipefail
        # The scanner's output also goes to a file, the report output, and
        # the exit-code output is set however the step ends.
        report=$(mktemp "${RUNNER_TEMP:-/tmp}/redaction-check.XXXXXX")
        trap 'status=$?; if [ -n "${GITHUB_OUTPUT:-}" ]; then printf "exit-code=%s\nreport=%s\n" "$status" "$report" >> "$GITHUB_OUTPUT"; fi' EXIT
        # The Python the setup step installed, by path. Bare `python` would be
        # whatever the caller's job has, since that step leaves PATH alone.
        if [ -z "${PYTHON:-}" ]; then
          echo "::error::The Set up Python step gave no python-path, so the scan cannot run."
          exit 2
        fi
        scan() {
          "$PYTHON" "${{ github.action_path }}/redaction_check.py" "$@" | tee -a "$report"
        }
        args=(--fail-on "$FAIL_ON")
        if [ -n "$PATTERNS_FILE" ]; then
          args+=(--patterns-file "$PATTERNS_FILE")
        fi
        # The scanner reads it from a commit, never from this checkout's files:
        # the base in added-lines mode (see the push case below), HEAD in
        # all-files mode.
        if [ -n "$ALLOW_FILE" ]; then
          args+=("--allow-file=$ALLOW_FILE")
        fi
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          args+=("--summary-file=$GITHUB_STEP_SUMMARY")
        fi
        if [ "$SKIP_SCANNER_FILES" = "true" ]; then
          args+=(--skip-scanner-files)
        fi

        if [ "$SCAN_MODE" = "all-files" ]; then
          scan --mode all-files "${args[@]}"
        else
          if [ -z "$BASE_REF" ]; then
            echo "::error::scan-mode is added-lines but no base ref is available. Set the base-ref input, or trigger this action on pull_request."
            exit 2
          fi
          # Before any git call. git fetch reads a value that starts with "-"
          # as an option, and --upload-pack=<command> runs that command over a
          # file or ssh remote. A control character could end a log line.
          case "$BASE_REF" in
            -* | *[[:cntrl:]]*)
              echo "::error::base-ref cannot start with '-' or hold a control character. Pass a branch name or a full commit SHA."
              exit 2
              ;;
          esac
          # A full commit SHA (github.event.before on a push) is the base as
          # it stands. Anything else names a branch on origin, fetched and
          # read by its full name. git reads a short name such as origin/main
          # as a tag or a local branch of that name first, and a push to a
          # branch called origin/main leaves such a local branch in the
          # checkout. A fetch of the short name main takes origin's tag main,
          # if it has one, and leaves origin/main where it was.
          if [[ "$BASE_REF" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            base="$BASE_REF"
            refspec="$BASE_REF"
          else
            base="refs/remotes/origin/$BASE_REF"
            refspec="+refs/heads/$BASE_REF:$base"
          fi
          # Full-depth fetch only. A shallow fetch into the checkout's full
          # clone marks the fetched tip as a history boundary. Once the base
          # has moved past the pull request's merge commit, that tip shares no
          # visible history with HEAD and there is no merge base to diff from.
          # A failed fetch still leaves the checkout's own copy of the base,
          # and the scanner fails loudly if that is missing too.
          if ! git fetch --no-tags origin -- "$refspec"; then
            # Escaped as @actions/core escapes a message, so the value cannot
            # end this line and start a workflow command of its own.
            ref=${BASE_REF//%/%25}; ref=${ref//$'\r'/%0D}; ref=${ref//$'\n'/%0A}
            echo "::warning::Could not fetch $ref from origin. Diffing against the checkout's own copy of it."
          fi
          # On a push to any branch but the default one, github.event.before
          # is that branch's previous tip, which the pusher wrote, so an entry
          # added in one push would count from the next without review. The
          # allow file comes from the default branch's tip instead, fetched
          # here in case the checkout is shallow, into origin/<name> by full
          # refspec, since a single-branch clone maps no other branch there.
          # It is passed by its full name too. git reads a short origin/<name>
          # as a tag or a local branch of that name first, and a push to a
          # branch called origin/main makes one, whose own list would count.
          # If it still names no commit, the scanner reads no allow file and
          # says so.
          if [ -n "$ALLOW_FILE" ] && [ "$EVENT_NAME" = "push" ] && [ "$GIT_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            if [ -z "$DEFAULT_BRANCH" ] || ! git fetch --no-tags origin -- "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"; then
              echo "::warning::Could not fetch the default branch, which the allow file is read from on this push."
            fi
            args+=("--allow-ref=refs/remotes/origin/$DEFAULT_BRANCH")
          fi
          # On a pull_request event the checkout is GitHub's test-merge commit.
          # Given the head SHA, the scanner diffs that commit against its own
          # first parent, which needs no merge base with the base branch. It
          # also scans each commit of the pull request on its own. If a
          # shallow checkout hides some of them, the scanner fetches their
          # history from origin, and the scan fails if any stay out of view.
          if [ -n "$PR_HEAD_SHA" ] && [ "$BASE_REF" = "$PR_BASE_REF" ]; then
            args+=(--pr-head "$PR_HEAD_SHA")
          fi
          scan --mode added-lines --base "$base" "${args[@]}"
        fi
